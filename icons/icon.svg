<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11141b"/>
      <stop offset="100%" stop-color="#0a0c11"/>
    </linearGradient>
    <radialGradient id="irisGlow" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#6e7bf2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6e7bf2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8189f5"/>
      <stop offset="100%" stop-color="#5866dc"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffa88b"/>
      <stop offset="100%" stop-color="#ff8a6b"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Obsidian Base Frame -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#irisGlow)"/>

  <!-- Video Window Frame / Tape Geometry -->
  <rect x="22" y="26" width="84" height="60" rx="10" fill="#191d27" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" filter="url(#subtleShadow)"/>

  <!-- Top Frame Sprockets / Film Strip Tick Marks (Bone) -->
  <rect x="28" y="31" width="10" height="6" rx="1.5" fill="#edece8" opacity="0.8"/>
  <rect x="44" y="31" width="10" height="6" rx="1.5" fill="#edece8" opacity="0.8"/>
  <rect x="60" y="31" width="10" height="6" rx="1.5" fill="#edece8" opacity="0.8"/>
  <rect x="76" y="31" width="10" height="6" rx="1.5" fill="#edece8" opacity="0.8"/>
  <rect x="92" y="31" width="8" height="6" rx="1.5" fill="#edece8" opacity="0.8"/>

  <!-- Viewport Sunken Screen -->
  <rect x="28" y="42" width="72" height="38" rx="6" fill="#070810" stroke="rgba(110, 123, 242, 0.2)" stroke-width="1"/>

  <!-- Play / Clip Chevron (Iris Accent) -->
  <polygon points="56,49 76,61 56,73" fill="url(#irisGrad)" filter="url(#subtleShadow)"/>

  <!-- Trimming Cut Line & Scissors / Notch Marker (Coral) -->
  <line x1="42" y1="92" x2="86" y2="92" stroke="#242935" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="92" x2="74" y2="92" stroke="url(#coralGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- In-point marker -->
  <circle cx="48" cy="92" r="4.5" fill="#ff8a6b" stroke="#0a0c11" stroke-width="1.5"/>
  <!-- Out-point marker -->
  <circle cx="74" cy="92" r="4.5" fill="#ff8a6b" stroke="#0a0c11" stroke-width="1.5"/>

  <!-- Live Hardware LED (Top Right) -->
  <circle cx="98" cy="22" r="4.5" fill="#56d98d"/>
  <circle cx="98" cy="22" r="7" fill="none" stroke="#56d98d" stroke-width="1" opacity="0.4"/>
</svg>
